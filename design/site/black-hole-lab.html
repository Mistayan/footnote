<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Footnote: black hole lab</title>
<link rel="stylesheet" href="lab.css">
<style>
:root{--bg:#09120b;--text:#eaf0eb;--muted:#a2afa5;--accent:#2b9185;--accent-ink:#101114;--glow:#5fd3c3;--line:#29332c;--panel:rgba(14,22,17,.74);
  --display:"Plus Jakarta Sans",system-ui,sans-serif;--body:"Hanken Grotesk",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:17px/1.6 var(--body);-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--glow);outline-offset:3px;border-radius:6px}
.hero{position:relative;min-height:760px;overflow:hidden;display:flex;align-items:center;padding:96px 6vw 120px;isolation:isolate}
#field{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.hero.nogl{background:radial-gradient(circle at 74% 50%,#09120b 0 9%,#5fd3c3 10%,#1b5d56 14%,#09120b 30%)}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(90deg,rgba(9,18,11,.86) 0%,rgba(9,18,11,.5) 30%,rgba(9,18,11,0) 46%)}
.copy{max-width:600px}
.label{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--glow)}
h1{font:600 clamp(40px,6vw,68px)/1.06 var(--display);letter-spacing:-.02em;margin:14px 0 18px}
h1 em{font-style:normal;color:var(--glow)}
.sub{color:var(--muted);max-width:52ch;margin-bottom:28px}
.btn{display:inline-block;padding:12px 20px;border-radius:999px;font-weight:600;text-decoration:none;border:1px solid var(--line);color:var(--text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);margin-right:8px}
.hint{margin-top:18px;font:12px var(--mono);color:var(--muted)}
</style>
</head>
<body>
<section class="hero" id="hero">
  <canvas id="field" aria-hidden="true"></canvas>
  <div class="copy">
    <p class="label">Footnote</p>
    <h1>What comes into focus is <em>your company's knowledge.</em></h1>
    <p class="sub">Local memory your coding agents can cite. Every answer comes back with its source: the file, the line, the date, and whether it changed since.</p>
    <a class="btn primary" href="#">Install Footnote</a><a class="btn" href="#">View on GitHub</a>
    <p class="hint">runs on your machine · no account · no telemetry</p>
  </div>
</section>
<script src="lab.js"></script>
<script>
// Black hole lab: the same one-shader black hole, now with a yellow companion star feeding it a stream of matter, gravitational lensing of the
// stars and of the companion's light (and its absorption near the hole), and a post stack (bloom halo, anamorphic streak, chromatic
// aberration, grain, exposure, vignette). Every effect has a slider. Lensing is a thin-lens approximation, not a ray tracer.
(function () {
  const hero = document.getElementById("hero"), cv = document.getElementById("field");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  // [group, key, label, min, max, step, default]
  const SPEC = [
    ["Disk", "uTilt", "Tilt", .06, .6, .01, .24], ["Disk", "uSize", "Size", .6, 1.6, .01, 1], ["Disk", "uBright", "Brightness", .2, 2.5, .01, 1],
    ["Disk", "uSpeed", "Spin speed", 0, 3, .01, 1], ["Disk", "uGas", "Gas swirl", 0, 2.5, .01, 1], ["Disk", "uSpk", "Speckles", 0, .35, .005, .1],
    ["Disk", "uDop", "Doppler side", 0, 1.2, .01, .75], ["Disk", "uHue", "Hue shift", 0, 6.28, .01, 0],
    ["Companion star", "uStar", "Star light", 0, 3, .01, 1], ["Companion star", "uSX", "Star x", 0, 1, .005, .3], ["Companion star", "uSY", "Star y", 0, 1, .005, .13],
    ["Companion star", "uStream", "Matter stream", 0, 3, .01, 1], ["Companion star", "uBow", "Stream curve", -.6, .6, .01, .25],
    ["Lensing", "uLens", "Lensing", 0, 1.6, .01, .9], ["Lensing", "uRing", "Photon ring", 0, 3, .01, 1.3],
    ["Post effects", "uBloom", "Bloom halo", 0, 2, .01, .6], ["Post effects", "uStreak", "Light streak", 0, 2, .01, .5], ["Post effects", "uAb", "Aberration", 0, 1.5, .01, .25],
    ["Post effects", "uGrain", "Film grain", 0, 2, .01, .5], ["Post effects", "uExpo", "Exposure", .6, 3, .01, 1.5], ["Post effects", "uVig", "Vignette", 0, 1, .01, .35]
  ];
  const S = {}; SPEC.forEach(s => S[s[1]] = s[6]);
  const gl = cv.getContext("webgl", { antialias: false, alpha: false, powerPreference: "low-power" });
  if (!gl) { hero.classList.add("nogl"); return; }
  const VS = "attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}";
  const FS = `precision highp float;
uniform vec2 R; uniform float T; uniform vec2 M;
uniform float uTilt,uSize,uBright,uSpeed,uGas,uSpk,uDop,uHue,uStar,uSX,uSY,uStream,uBow,uLens,uRing,uBloom,uStreak,uAb,uGrain,uExpo,uVig;
float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(h21(i),h21(i+vec2(1.,0.)),f.x),mix(h21(i+vec2(0.,1.)),h21(i+vec2(1.,1.)),f.x),f.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*vn(p);p=p*2.03+7.1;a*=.5;}return s;}
vec3 hue(vec3 c,float a){float k=cos(a),s=sin(a);vec3 ax=vec3(.57735);return c*k+cross(ax,c)*s+ax*dot(ax,c)*(1.-k);}
vec3 ramp(float x){vec3 a=vec3(.02,.10,.09),b=vec3(.17,.56,.52),c=vec3(.37,.83,.76),d=vec3(.92,1.,.97);
  return hue(x<.5?mix(a,b,x*2.):x<.85?mix(b,c,(x-.5)/.35):mix(c,d,(x-.85)/.15),uHue);}
vec4 disk(float rr,float an,float lit){
  float om=1.4/pow(rr,1.5)*uSpeed;
  float a2=an-T*om;
  float gas=fbm(vec2(a2*2.2,rr*7.))*1.2*uGas;
  vec2 cell=vec2(floor(rr*26.),floor(a2*rr*5.));
  vec2 fc=vec2(fract(rr*26.),fract(a2*rr*5.))-.5;
  float dots=step(1.-uSpk,h21(cell))*smoothstep(.34,.0,length(fc));
  float boost=1.+uDop*cos(an)+lit;
  float inten=(.28+gas+dots*1.6)*boost*pow(1.7/rr,1.5)*uBright;
  return vec4(ramp(clamp(inten*.8,0.,1.))*inten,inten);
}
vec2 centre(float asp){return asp>1.15?vec2(asp*.2,-.01):vec2(0.,-.26);}
vec3 scene(vec2 fc){
  float asp=R.x/R.y;
  vec2 uv=(fc-.5*R)/R.y;
  vec2 c=centre(asp);
  float Rs=asp>1.15?.15:.17;
  float roll=(M.x-.5)*.3; mat2 rot=mat2(cos(roll),-sin(roll),sin(roll),cos(roll));
  vec2 p=rot*(uv-c);
  float tilt=clamp(uTilt+(M.y-.5)*.16,.06,.6);
  vec2 sp=rot*(vec2((uSX-.5)*asp,uSY-.5)-c);                    // companion star, relative to the hole
  float r=length(p);
  vec2 pl=p-uLens*Rs*Rs*p/max(dot(p,p),Rs*Rs*.6);               // where this pixel's light came from (thin lens)
  vec3 col=vec3(.035,.07,.043);
  vec2 fcs=fc+(pl-p)*R.y;                                       // distant stars, bent by the same lens
  float st=h21(floor(fcs/2.));
  col+=vec3(.5,.75,.7)*step(.9985,st)*(.3+.7*h21(floor(fcs/2.)+9.));
  float absorb=mix(.2,1.,smoothstep(Rs*.9,Rs*3.4,r));           // light passing close to the hole is swallowed
  vec2 dd=pl-sp; float d=length(dd);
  float spikes=(exp(-abs(dd.x)*140.)*exp(-abs(dd.y)*5.)+exp(-abs(dd.y)*140.)*exp(-abs(dd.x)*5.))*.35;
  col+=vec3(1.,.82,.35)*(exp(-d*d/.0004)*2.+.0013/(d*d+.0036)+spikes)*uStar*absorb;
  vec2 v=-sp; float len=length(v); vec2 dir=v/len, nrm=vec2(-dir.y,dir.x);
  float u=dot(pl-sp,dir)/len;                                   // matter stream: star to hole, bowed, widening towards the hole
  float dn=dot(pl-sp,nrm)-uBow*len*sin(3.14159*clamp(u,0.,1.));
  float w=mix(.004,.03,u*u)+.003;
  float dens=exp(-pow(dn/w,2.))*smoothstep(0.,.05,u)*(1.-smoothstep(.95,1.,u));
  float flow=fbm(vec2(u*len*38.-T*1.6,dn/w*1.3));
  vec2 cc=vec2(u*len*90.-T*1.2,dn/w*3.);
  float sdot=step(.93,h21(floor(cc)))*smoothstep(.4,0.,length(fract(cc)-.5));
  col+=mix(vec3(1.,.8,.3),vec3(1.,.42,.1),u)*dens*(.2+1.2*flow+sdot*2.5)*(.4+u*1.6)*uStream;
  float lit=uStar*.35*max(cos(atan(p.y,p.x)-atan(sp.y,sp.x)),0.);
  if(r>Rs){                                                     // far side of the disk, bent over and under the hole
    float rr=r/Rs, an=atan(p.y,p.x);
    float vis=smoothstep(1.,1.12,rr)*exp(-(rr-1.)*1.5);
    float up=.3+.7*smoothstep(-.4,1.,p.y/r);
    col+=disk(1.15+(rr-1.)*1.3,an,lit).rgb*vis*up*1.6;
  }
  col+=ramp(.97)*exp(-pow((r-Rs*1.03)/(Rs*.02),2.))*1.3*uRing;  // photon ring
  col+=ramp(.7)*exp(-pow((r-Rs*1.03)/(Rs*.10),2.))*.18*uRing;
  col+=ramp(.6)*exp(-max(r-Rs,0.)/(Rs*.9))*.1*uBloom;           // bloom halo
  col+=vec3(.45,.9,.85)*uStreak*exp(-abs(p.y)/.0035)*exp(-abs(p.x)/(Rs*3.4))*.7; // anamorphic streak
  if(r<Rs) col=vec3(0.);                                        // the shadow
  vec2 q=vec2(p.x,p.y/tilt);
  float rd=length(q)/Rs, ang=atan(q.y,q.x);
  float mask=smoothstep(1.5,1.9,rd)*(1.-smoothstep(4.2*uSize,5.4*uSize,rd));
  if(q.y>0. && r<Rs*1.02) mask=0.;
  col+=disk(rd,ang,lit).rgb*mask*1.5;
  return col;
}
void main(){
  vec2 fc=gl_FragCoord.xy; float asp=R.x/R.y;
  vec3 col;
  if(uAb>.01){vec2 off=(fc-(centre(asp)*R.y+.5*R))*uAb*.012;col=vec3(scene(fc+off).r,scene(fc).g,scene(fc-off).b);}
  else col=scene(fc);
  col=1.-exp(-col*uExpo);
  vec2 uv=(fc-.5*R)/R.y;
  col*=1.-uVig*smoothstep(.55,1.05,length(uv/vec2(asp*.5,.5)));
  col+=(h21(fc+fract(T)*97.)-.5)*uGrain*.06;
  gl_FragColor=vec4(col,1.);
}`;
  function sh(t, s) { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; }
  let pr;
  try { pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(pr); }
  catch (e) { console.warn(e); hero.classList.add("nogl"); return; }
  gl.useProgram(pr);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr, "a"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const uR = gl.getUniformLocation(pr, "R"), uT = gl.getUniformLocation(pr, "T"), uM = gl.getUniformLocation(pr, "M");
  const U = {}; SPEC.forEach(s => U[s[1]] = gl.getUniformLocation(pr, s[1]));
  let scale = Math.min(devicePixelRatio || 1, 1.5), m = [.5, .5], target = [.5, .5], t0 = performance.now(), running = false, visible = true, slow = 0, last = 0;
  function size() { cv.width = Math.round(hero.clientWidth * scale); cv.height = Math.round(hero.clientHeight * scale); gl.viewport(0, 0, cv.width, cv.height); }
  function render(t) {
    gl.uniform2f(uR, cv.width, cv.height); gl.uniform1f(uT, t); gl.uniform2f(uM, m[0], m[1]);
    for (const k in U) gl.uniform1f(U[k], S[k]);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  function frame(now) {
    if (!running) return;
    const dt = now - last; last = now;
    slow = dt > 30 ? slow + 1 : Math.max(0, slow - 1);
    if (slow > 40 && scale > .5) { scale *= .8; slow = 0; size(); }       // fewer pixels on a slow device (3 scene passes with aberration on)
    m[0] += (target[0] - m[0]) * .06; m[1] += (target[1] - m[1]) * .06;
    render((now - t0) / 1000); requestAnimationFrame(frame);
  }
  function start() { if (!running && !reduce && visible && !document.hidden) { running = true; last = performance.now(); requestAnimationFrame(frame); } }
  const still = () => { if (!running) render(3.2); };

  Lab.panel({ title: "Black hole", subtitle: "Tweak, then Copy the settings back", spec: SPEC, state: S, open: ["Companion star"], onChange: still });

  size(); render(3.2);
  if (!reduce) {
    hero.addEventListener("pointermove", e => { if (e.target.closest && e.target.closest('.lab')) return; const r = hero.getBoundingClientRect(); target = [(e.clientX - r.left) / r.width, 1 - (e.clientY - r.top) / r.height]; });
    hero.addEventListener("pointerleave", () => { target = [.5, .5]; });
    new IntersectionObserver(es => { visible = es[0].isIntersecting; visible ? start() : (running = false); }).observe(hero);
    document.addEventListener("visibilitychange", () => document.hidden ? (running = false) : start());
    start();
  }
  let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { size(); still(); }, 120); });
})();
</script>
</body>
</html>
