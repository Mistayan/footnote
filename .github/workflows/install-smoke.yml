# The README's one-command installs, run on clean machines (#335): the latest release's shell installer in minimal Linux
# containers, and its PowerShell installer in a Windows Server Core container, which, unlike the runner itself, has no
# Visual C++ runtime. Each runs the documented prerequisites first, then checks that the installed engine starts.
# By hand after a release (a release made with GITHUB_TOKEN triggers no workflow), and on changes to this file.
name: install-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/install-smoke.yml

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:13"]
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    timeout-minutes: 15
    steps:
      - name: Prerequisites (README)
        run: |
          apt-get update -qq
          apt-get install -y -qq curl ca-certificates xz-utils libgomp1 libssl3t64 || apt-get install -y -qq curl ca-certificates xz-utils libgomp1 libssl3
      - name: Install (README one-liner)
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/bobcat88/footnote/releases/latest/download/footnote-installer.sh | sh
      - name: The engine starts
        run: |
          ~/.cargo/bin/footnote --version
          FOOTNOTE_STATE_DIR="$RUNNER_TEMP/state" ~/.cargo/bin/footnote status > /dev/null

  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Install in a clean Windows container (README one-liner, after the Visual C++ runtime)
        shell: pwsh
        run: |
          $script = @'
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          # Without the runtime the engine cannot start (VCRUNTIME140.dll); record it, to keep the README's prerequisite honest.
          irm https://github.com/bobcat88/footnote/releases/latest/download/footnote-installer.ps1 | iex
          $exe = Join-Path $env:USERPROFILE '.cargo\bin\footnote.exe'
          $p = Start-Process $exe -ArgumentList '--version' -Wait -PassThru -NoNewWindow
          Write-Host "without the Visual C++ runtime: exit $($p.ExitCode)"
          Invoke-WebRequest https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile C:\vc_redist.x64.exe -UseBasicParsing
          $r = Start-Process C:\vc_redist.x64.exe -ArgumentList '/install', '/quiet', '/norestart' -Wait -PassThru
          Write-Host "vc_redist: exit $($r.ExitCode)"
          foreach ($d in 'vcruntime140', 'vcruntime140_1', 'msvcp140', 'msvcp140_1', 'vcomp140', 'd3d12', 'dxgi', 'directml') {
            Write-Host "$d.dll in System32: $(Test-Path "$env:SystemRoot\System32\$d.dll")"
          }
          & $exe --version
          Write-Host "with the runtime: exit $LASTEXITCODE"
          if ($LASTEXITCODE) { exit 1 }
          $env:FOOTNOTE_STATE_DIR = 'C:\state'
          & $exe status | Out-Null
          exit $LASTEXITCODE
          '@
          Set-Content "$env:RUNNER_TEMP\smoke.ps1" $script
          docker run --rm -v "${env:RUNNER_TEMP}:C:\w" mcr.microsoft.com/windows/servercore:ltsc2022 powershell -NoProfile -ExecutionPolicy Bypass -File C:\w\smoke.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
