# Footnote: one long-lived hardened daemon for one person's agents, plus a helper profile for network commands (#392).
#
# Daily use: warm ONNX models for every agent of this user (Claude Code, Codex, Gemini CLI, Antigravity, parallel
# sessions), the way one memory.db already serves them on a host.
#   docker compose up -d
#   MCP command for each agent: docker exec -i footnote footnote --db /state/memory.db mcp
#   Memory hook for each agent: docker exec -i footnote footnote hook
#   Register both with every detected agent in one go:
#     Windows: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\docker-agents.ps1
#     Linux / macOS: bash scripts/docker-agents.sh
#
# Network commands only (models install, docs add, crawl). This service mounts no workspace:
#   docker compose --profile net run --rm footnote-net models install bekko-a8m gte-small
#   docker compose --profile net run --rm footnote-net models use bekko-a8m gte-small
#
# Required: FOOTNOTE_WORKSPACES, the host folder of repositories to mount read-only at /workspaces, as an environment
# variable or in a `.env` file next to this one. FOOTNOTE_PATH_MAP is derived from it unless you set it yourself, so
# host paths translate to container paths (for example a Windows host):
#     FOOTNOTE_WORKSPACES=C:\Users\<user>\repos
#
# One person per container: anyone who can use this Docker engine (`docker exec`) can read, change and delete every
# memory in the state volume (SECURITY.md, "One person per container").
#
# Optional settings (single user):
# - FOOTNOTE_CONTAINER_NAME (default footnote): run a second container next to the usual one for a while (for example
#   to try a newly built image before switching to it).
# - FOOTNOTE_IMAGE (default footnote:local): test another locally built tag without overwriting footnote:local.
# - FOOTNOTE_STATE_VOLUME (default footnote-state): attach an existing named Docker volume that has another name.
# - FOOTNOTE_PATH_MAP: explicit host-to-container prefix map override.
# - FOOTNOTE_PIDS_LIMIT (default 512), FOOTNOTE_MEM_LIMIT (default 4g): tune resource caps for this machine.

x-hardened: &hardened
  build:
    context: .
    dockerfile: Dockerfile
  image: ${FOOTNOTE_IMAGE:-footnote:local}
  init: true
  user: "10001:10001"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  # One runaway agent must not exhaust the host: bounded processes, memory and logs.
  pids_limit: ${FOOTNOTE_PIDS_LIMIT:-512}
  mem_limit: ${FOOTNOTE_MEM_LIMIT:-4g}
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  footnote:
    <<: *hardened
    container_name: ${FOOTNOTE_CONTAINER_NAME:-footnote}
    restart: unless-stopped
    network_mode: none
    environment:
      # Offline daemon: turns off live fetch-on-miss (footnote find, footnote_recall all=true) and scheduled
      # memory-clean (which requires a host agent CLI and outbound network).
      FOOTNOTE_NO_LIVE_FETCH: "1"
      FOOTNOTE_PATH_MAP: ${FOOTNOTE_PATH_MAP:-${FOOTNOTE_WORKSPACES}=/workspaces}
    command:
      - --db
      - /state/memory.db
      - serve
      - --mcp
      - --daemon
    volumes:
      - footnote-state:/state
      - ${FOOTNOTE_WORKSPACES:?set FOOTNOTE_WORKSPACES to the host folder of repositories to mount read-only}:/workspaces:ro
    # Cheap 5 s check (no binary spawn): tests for the socket file only, so after a hard crash a stale socket in /state
    # can briefly report healthy until the restarted daemon binds it.
    healthcheck:
      test: ["CMD-SHELL", "for s in \"$$FOOTNOTE_STATE_DIR\"/footnote-*.sock; do [ -S \"$$s\" ] && exit 0; done; exit 1"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 2s

  # Default bridge network: outbound only, no published port, never `host`. No workspace mount: the one container that
  # can reach the network sees no repository.
  footnote-net:
    <<: *hardened
    profiles:
      - net
    volumes:
      - footnote-state:/state

volumes:
  footnote-state:
    # One name for the Compose daemon and the one-shot `docker run -v footnote-state:/state` commands of DOCKER.md.
    name: ${FOOTNOTE_STATE_VOLUME:-footnote-state}
