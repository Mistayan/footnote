[package]
name = "footnote-launcher"
version = "0.1.0"
description = "Footnote One: the desktop window over the footnote engine"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.92"

# Its own workspace: Tauri stays out of the engine's build and CI.
[workspace]

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = ["tray-icon"] }
serde_json = "1"
tauri-plugin-single-instance = "=2.5.5"

[features]
# Enables embedded `../dist` assets in release builds (`tauri build`); left off in `tauri dev` so `devUrl` works.
custom-protocol = ["tauri/custom-protocol"]
