[package]
name = "footnote"
version = "0.1.0"
edition = "2024"
description = "Local, read-only memory and document retrieval for AI coding agents, with a footnote on every answer"
license = "Apache-2.0"
repository = "https://github.com/bobcat88/footnote"
rust-version = "1.92"

[features]
# Opt-in timings and failure tracking (src/metrics.rs). Off in normal builds: zero cost.
metrics = []
# Opt-in GGUF embedding models through llama.cpp, compiled in (bench/experiments/LLAMACPP-INPROCESS.md). Needs CMake and LLVM to build.
llama = ["dep:llama-cpp-2"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"
tempfile = "3"
wait-timeout = "0.2"
time = { version = "0.3", features = ["local-offset"] }
interprocess = "2.4.8"
getrandom = "0.4.3"
tantivy = "0.27"
# Embeddings in-process (src/encoder.rs): ONNX Runtime 1.31, statically linked; the tokenizer library under Python's `tokenizers` 0.22.2.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-native", "api-31"] }
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }
llama-cpp-2 = { version = "=0.1.161", default-features = false, features = ["openmp"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[dev-dependencies]
assert_cmd = "2"
interprocess = "2.4.8"
sha2 = "0.10"
