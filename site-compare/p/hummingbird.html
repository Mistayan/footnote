<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Footnote: particle hummingbird prototype</title>
<style>
:root{--bg:#09120b;--text:#eaf0eb;--muted:#a2afa5;--accent:#2b9185;--accent-ink:#101114;--glow:#5fd3c3;--line:#29332c;
  --display:"Plus Jakarta Sans",system-ui,sans-serif;--body:"Hanken Grotesk",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:17px/1.6 var(--body);-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--glow);outline-offset:3px;border-radius:6px}
.hero{position:relative;min-height:760px;overflow:hidden;display:flex;align-items:center;padding:96px 6vw 120px;isolation:isolate}
#field{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(90deg,rgba(9,18,11,.86) 0%,rgba(9,18,11,.5) 36%,rgba(9,18,11,0) 58%)}
.copy{max-width:640px}
.label{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--glow)}
h1{font:600 clamp(40px,6vw,68px)/1.06 var(--display);letter-spacing:-.02em;margin:14px 0 18px}
h1 em{font-style:normal;color:var(--glow)}
.sub{color:var(--muted);max-width:52ch;margin-bottom:28px}
.btn{display:inline-block;padding:12px 20px;border-radius:999px;font-weight:600;text-decoration:none;border:1px solid var(--line);color:var(--text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);margin-right:8px}
.hint{margin-top:18px;font:12px var(--mono);color:var(--muted)}
</style>
</head>
<body>
<section class="hero" id="hero">
  <canvas id="field" aria-hidden="true"></canvas>
  <div class="copy">
    <p class="label">Footnote</p>
    <h1>What comes into focus is <em>your company's knowledge.</em></h1>
    <p class="sub">Local memory your coding agents can cite. Every answer comes back with its source: the file, the line, the date, and whether it changed since.</p>
    <a class="btn primary" href="#">Install Footnote</a><a class="btn" href="#">View on GitHub</a>
    <p class="hint">runs on your machine · no account · no telemetry</p>
  </div>
</section>
<script>
// Particle hummingbird: ~8,000 points sampled on the surface of a 3D bird (body, head, beak, tail, two wings), rotated and
// projected with perspective every frame. Edges are brighter (rim light) so the outline reads as the outer layer of the bird.
// It hovers on the right, drifts a little, and beats its wings slowly. The pointer turns it slightly. No libraries, no network.
(function () {
  const hero = document.getElementById("hero"), c = document.getElementById("field"), g = c.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const COLORS = [[95, 211, 195], [74, 163, 232], [196, 245, 236]], AB = 5;   // teal, blue, pale
  const rnd = Math.random, TAU = Math.PI * 2;
  const P = [];   // one entry per particle: local x,y,z, local normal, colour index, wing side (0 = rigid part), edge flag
  const add = (x, y, z, nx, ny, nz, col, side = 0, edge = 0, solid = 0) => P.push({ x, y, z, nx, ny, nz, col, side, edge, solid });

  function ellipsoid(cx, cy, cz, rx, ry, rz, n, colOf) {
    for (let i = 0; i < n; i++) {
      let a = rnd() * TAU, b = Math.acos(2 * rnd() - 1), dx = Math.sin(b) * Math.cos(a), dy = Math.cos(b), dz = Math.sin(b) * Math.sin(a);
      let nx = dx / rx, ny = dy / ry, nz = dz / rz, l = Math.hypot(nx, ny, nz);
      add(cx + dx * rx, cy + dy * ry, cz + dz * rz, nx / l, ny / l, nz / l, colOf(dy), 0, 0, 1);
    }
  }
  function build(mult) {
    P.length = 0;
    ellipsoid(.3, 0, 0, .9, .44, .38, 2800 * mult, dy => dy > -.1 ? 0 : 1);                   // chest and back: teal over blue
    ellipsoid(-.85, -.05, 0, .85, .2, .17, 1100 * mult, dy => dy > 0 ? 0 : 1);                  // body tapering to the tail
    ellipsoid(1.12, -.02, 0, .27, .27, .25, 950 * mult, dy => dy > .2 ? 2 : 0);                // small head
    const bc = Math.cos(-.95), bs = Math.sin(-.95);                                            // beak bent down from the body axis
    for (let i = 0; i < 320 * mult; i++) {
      const u = rnd(), a = rnd() * TAU, r = .045 * (1 - u) + .008, l = .12 + u * .95, ry = Math.sin(a) * r;
      add(1.12 + bc * l - bs * ry, -.02 + bs * l + bc * ry, Math.cos(a) * r, 0, Math.sin(a), Math.cos(a), 2, 0, 0, 1);
    }
    for (let i = 0; i < 500 * mult; i++) {                                                     // narrow tail, feather lines emphasised
      const u = rnd(), w = .05 + .2 * u, e = rnd() < .5, z = e ? [-1, 0, 1][rnd() * 3 | 0] * w : (rnd() * 2 - 1) * w;
      add(-1.6 - u * .85, -.14 - .12 * u, z, 0, 1, 0, rnd() < .5 ? 1 : 0, 0, e ? 1 : 0);
    }
    for (const side of [1, -1]) for (let i = 0; i < 3800 * mult; i++) {                        // long pointed wings swept back, with feather ribs
      let s = rnd(), t = rnd(), rib = rnd() < .25;
      if (rib) { s = .3 + Math.floor(rnd() * 8) / 8 * .7 + (rnd() - .5) * .012; t = Math.pow(rnd(), .8); }
      s = Math.min(1, s);
      const tooth = (s * 11) % 1;
      if (s > .2 && t > .6 && tooth > .74) t = rnd() * .6;                                     // gaps between the feather tips
      const ch = (1 + .2 * tooth) * .62 * Math.sin(Math.PI * Math.min(1, s * .8 + .12)) * (1 - .6 * s * s) + .04, lead = .5 - s * .8;
      if (rnd() < .18) t = rnd() < .5 ? 0 : 1;
      add(lead - t * ch * 1.5, .28 - s * .1, .2 + s * 3.4, 0, 1, 0, rnd() < .65 ? 1 : 0, side, (t === 0 || t === 1 || rib) ? 1 : 0);
    }
  }
  let W, H, k, cx, cy, unit, mult = 1, ptr = { x: .5, on: false }, yawBias = 0, running = false, visible = true, last = 0, slow = 0;
  function size() {
    k = Math.min(devicePixelRatio || 1, 2); W = hero.clientWidth; H = hero.clientHeight; c.width = W * k; c.height = H * k;
    const m = W < 700; cx = m ? W * .6 : W * .72; cy = m ? H * .74 : H * .5; unit = m ? Math.min(W * .14, H * .11) : Math.min(W * .09, H * .14);
  }
  function draw(t) {
    g.setTransform(k, 0, 0, k, 0, 0); g.clearRect(0, 0, W, H);
    const flap = Math.sin(t * TAU / 1.2), sweep = Math.cos(t * TAU / 1.2);                   // slow beat, one stroke every 1.2 s
    const bx = Math.sin(t * .9) * .25 + Math.sin(t * 2.3) * .06, by = Math.sin(t * 1.3 + 1) * .18 + Math.sin(t * 3.1) * .04;   // buzzing drift
    const pitch = .92 + Math.sin(t * 1.1) * .05, yaw = Math.PI + .8 + Math.sin(t * .5) * .22 + yawBias;
    const cp = Math.cos(pitch), sp = Math.sin(pitch), cyw = Math.cos(yaw), syw = Math.sin(yaw);
    const th = .85 + flap * .45, ct = Math.cos(th), st = Math.sin(th), D = 7;
    const out = Array.from({ length: COLORS.length * AB }, () => []), CELL = 4, cw = Math.ceil(W / CELL) + 1, zb = new Float32Array(cw * (Math.ceil(H / CELL) + 1)).fill(-1e9), vis = [];
    for (const q of P) {
      let x = q.x, y = q.y, z = q.z, nx = q.nx, ny = q.ny, nz = q.nz;
      if (q.side) { const zl = z, ny0 = y; y = ny0 * ct + zl * st; z = q.side * (zl * ct - ny0 * st); x += sweep * .18 * (zl - .2); ny = ct; nz = q.side * -st; }
      let px = x * cp - y * sp, py = x * sp + y * cp, nxx = nx * cp - ny * sp, nyy = nx * sp + ny * cp;
      const X = px * cyw + z * syw, Z = -px * syw + z * cyw, NZ = -nxx * syw + nz * cyw;
      if (q.solid && NZ < 0) continue;                                                       // hide the far side of solid parts: only the outside shows
      const sc = D / (D - (Z + .0)), rim = 1 - Math.abs(NZ);
      let a = q.side ? .32 + .5 * q.edge + .12 * rim : .4 + .5 * rim * rim + .22 * Math.max(0, nyy);
      a = Math.min(1, a * (.55 + .45 * Math.min(1.4, sc) / 1.4 + .25));
      const sx = cx + (X + bx) * unit * sc, sy = cy - (py + by) * unit * sc;
      const cell = ((sy / CELL) | 0) * cw + ((sx / CELL) | 0);
      if (sx < 0 || sy < 0 || sx >= W || sy >= H) continue;
      if (Z > zb[cell]) zb[cell] = Z;
      vis.push(cell, Z, q.col * AB + Math.min(AB - 1, (a * AB) | 0), sx, sy, Math.max(1, 1.5 * sc * unit / 130));
    }
    for (let i = 0; i < vis.length; i += 6)                                                    // line of sight: drop whatever sits behind a nearer surface
      if (vis[i + 1] >= zb[vis[i]] - .16) out[vis[i + 2]].push(vis[i + 3], vis[i + 4], vis[i + 5]);
    for (let i = 0; i < out.length; i++) {
      const arr = out[i]; if (!arr.length) continue; const col = COLORS[(i / AB) | 0];
      g.fillStyle = `rgba(${col[0]},${col[1]},${col[2]},${(((i % AB) + .6) / AB).toFixed(3)})`;
      for (let j = 0; j < arr.length; j += 3) g.fillRect(arr[j], arr[j + 1], arr[j + 2], arr[j + 2]);
    }
  }
  function frame(now) {
    if (!running) return;
    const dt = now - last; last = now;
    slow = dt > 26 ? slow + 1 : Math.max(0, slow - 1);
    if (slow > 40 && mult > .35) { mult *= .75; slow = 0; build(mult); }                  // thin out on a slow device
    if (ptr.on) yawBias += ((ptr.x - .72) * .5 - yawBias) * .04; else yawBias *= .96;
    draw(now / 1000); requestAnimationFrame(frame);
  }
  function start() { if (!running && !reduce && visible && !document.hidden) { running = true; last = performance.now(); requestAnimationFrame(frame); } }
  mult = innerWidth < 700 ? .5 : 1; build(mult); size(); draw(.25);                           // reduced motion: one still frame, wings raised
  if (!reduce) {
    hero.addEventListener("pointermove", e => { const r = hero.getBoundingClientRect(); ptr.x = (e.clientX - r.left) / r.width; ptr.on = true; });
    hero.addEventListener("pointerleave", () => { ptr.on = false; });
    new IntersectionObserver(es => { visible = es[0].isIntersecting; visible ? start() : (running = false); }).observe(hero);
    document.addEventListener("visibilitychange", () => document.hidden ? (running = false) : start());
    start();
  }
  let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { size(); if (!running) draw(.25); }, 120); });
})();
</script>
</body>
</html>
